name: Browser final identity sequence diagnostic
on:
  push:
    branches: [compatibility/windows-process-probe]
permissions:
  contents: read
jobs:
  combined:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: 736c45701fe96157644479a91fe507bea3135d22
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi-agent-browser-native
          ref: 6075283fea803fb5d002700852e591ef7d3a2caa
          path: browser
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          check-latest: true
          package-manager-cache: false
      - name: Initialize native Windows module discovery for bash
        shell: pwsh
        run: '"PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Use the same native npm toolchain
        shell: bash
        run: npm install --global npm@11.19.0
      - name: Run unchanged affected files once without identity warmup
        shell: bash
        run: node probe/identity-final/check.mjs "$GITHUB_WORKSPACE/automation" "$GITHUB_WORKSPACE/browser" "$GITHUB_WORKSPACE/probe/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: browser-identity-final
          path: probe/evidence
          if-no-files-found: error
