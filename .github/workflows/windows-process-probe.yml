name: Windows process query diagnostic
on:
  push:
    branches: [compatibility/windows-process-probe]
permissions:
  contents: read
jobs:
  doctor-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi-agent-browser-native
          ref: 6075283fea803fb5d002700852e591ef7d3a2caa
          path: browser
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Run complete doctor regressions against original and final runtime
        shell: bash
        run: node probe/doctor-final/check.mjs "$GITHUB_WORKSPACE/browser" "$GITHUB_WORKSPACE/probe/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: browser-doctor-final-${{ matrix.node }}
          path: probe/evidence
          if-no-files-found: error
