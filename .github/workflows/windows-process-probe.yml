name: Windows process query diagnostic
on:
  push:
    branches: [compatibility/windows-process-probe]
permissions:
  contents: read
jobs:
  oracle-profile:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: a78d00c02fa2f3c05fe53b082f0a338150981a65
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi-oracle
          ref: a98097c81a9355c5138ac26cb2c9b8b8e15bf5b6
          path: oracle
          sparse-checkout: |
            extensions/oracle/shared/browser-profile-helpers.mjs
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Initialize native Windows module discovery for bash
        shell: pwsh
        run: '"PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Compare original and corrected private Oracle cleanup fixture paths
        shell: bash
        run: node probe/oracle-profile-path-probe.mjs
