name: Windows process query diagnostic
on:
  push:
    branches: [compatibility/windows-process-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: 425f6367e5c5d997cac271b011d9cce76cd57d6c
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi-agent-browser-native
          ref: 9d0fb58abedf34dd26e2fa76c04d1f4159070e63
          path: browser
          sparse-checkout: |
            extensions/agent-browser/lib/process-identity.ts
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Compare native process queries without exposing environment values
        run: node --experimental-strip-types probe/windows-process-probe.mjs
