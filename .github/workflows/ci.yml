name: Automation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source-ref:
        description: Fleet source ref (empty uses the configured rollout ref or main)
        type: string
        default: ''
      fork-ref:
        description: Exact candidate fork commit (empty resolves maintained main)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: automation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.fork-ref || 'main' }}
  cancel-in-progress: true

jobs:
  hosts:
    uses: ./.github/workflows/resolve-hosts.yml
    with:
      automation-ref: ${{ github.sha }}
      fork-ref: ${{ inputs.fork-ref }}

  tests:
    needs: hosts
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - run: |
          PM="$(node -p 'require("./package.json").packageManager')"
          # Install with the target npm itself: an older npm cannot replace itself across majors in place.
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - run: npm test
      - name: Install this run's latest official host in an empty profile
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_VERSION: ${{ needs.hosts.outputs.official-version }}
        run: |
          node --input-type=module <<'JS'
          import { join } from 'node:path';
          import { isolatedEnvironment } from './scripts/common.mjs';
          import { prepareHost } from './scripts/hosts.mjs';
          const root = process.env.RUNNER_TEMP;
          await prepareHost(join(root, 'test-host'), 'official', process.env.OFFICIAL_VERSION, isolatedEnvironment(join(root, 'profile')));
          JS
      - name: Prove correct selection and seeded startup failures through the real CLI
        env:
          PI_TEST_HOST: ${{ runner.temp }}/test-host
        run: npm run test:native

  windows-environment:
    # Windows qualification is owner-waived; retain this diagnostic without gating delivery.
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Initialize native Windows module discovery for bash
        shell: pwsh
        run: '"PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Query native process identity in the isolated environment
        shell: bash
        run: node --test test/windows-environment.native.mjs

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: |
          PM="$(node -p 'require("./package.json").packageManager')"
          # Install with the target npm itself: an older npm cannot replace itself across majors in place.
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - run: npm ci --ignore-scripts
      - run: npm rebuild re2
      - run: npm run check:renovate
      - name: Validate native workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  fleet:
    needs: hosts
    uses: ./.github/workflows/pi-compatibility.yml
    with:
      automation-ref: ${{ github.sha }}
      repository: all
      official-version: ${{ needs.hosts.outputs.official-version }}
      fork-ref: ${{ needs.hosts.outputs.fork-ref }}
      # During the initial cross-repository PR rollout, this variable selects the candidate branches.
      # Clear it once those branches have merged; normal operation always qualifies main.
      source-ref: ${{ inputs.source-ref || vars.PI_COMPATIBILITY_SOURCE_REF || 'main' }}

  automation:
    if: always()
    needs: [hosts, tests, configuration, fleet]
    runs-on: ubuntu-latest
    steps:
      - env:
          HOSTS: ${{ needs.hosts.result }}
          TESTS: ${{ needs.tests.result }}
          CONFIGURATION: ${{ needs.configuration.result }}
          FLEET: ${{ needs.fleet.result }}
        run: test "$HOSTS" = success && test "$TESTS" = success && test "$CONFIGURATION" = success && test "$FLEET" = success
