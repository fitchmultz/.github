name: Automation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source-ref:
        description: Fleet source ref (empty uses the configured rollout ref or main)
        type: string
        default: ''
      fork-ref:
        description: Exact candidate fork commit (empty resolves maintained main)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: automation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.fork-ref || 'main' }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fleet-required: ${{ steps.scope.outputs.fleet-required }}
      fleet-repository: ${{ steps.scope.outputs.fleet-repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci.mjs scope --event "$EVENT" --base "$BASE" --head "$HEAD"

  hosts:
    uses: ./.github/workflows/resolve-hosts.yml
    with:
      automation-ref: ${{ github.sha }}
      fork-ref: ${{ inputs.fork-ref }}

  tests:
    needs: hosts
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.5', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - run: |
          PM="$(node -p 'require("./package.json").packageManager')"
          # Install with the target npm itself: an older npm cannot replace itself across majors in place.
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - run: npm test
      - name: Install this run's latest official host in an empty profile
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_VERSION: ${{ needs.hosts.outputs.official-version }}
        run: |
          node --input-type=module <<'JS'
          import { join } from 'node:path';
          import { isolatedEnvironment } from './scripts/common.mjs';
          import { prepareHost } from './scripts/hosts.mjs';
          const root = process.env.RUNNER_TEMP;
          await prepareHost(join(root, 'test-host'), 'official', process.env.OFFICIAL_VERSION, isolatedEnvironment(join(root, 'profile')));
          JS
      - name: Prove correct selection and seeded startup failures through the real CLI
        env:
          PI_TEST_HOST: ${{ runner.temp }}/test-host
          PI_COMPAT_EVIDENCE_DIR: ${{ runner.temp }}/native-probes
        run: npm run test:native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: automation-native-${{ matrix.node }}
          path: ${{ runner.temp }}/native-probes
          if-no-files-found: error
          retention-days: 7

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: |
          PM="$(node -p 'require("./package.json").packageManager')"
          # Install with the target npm itself: an older npm cannot replace itself across majors in place.
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - run: npm ci --ignore-scripts
      - run: npm rebuild re2
      - run: npm run check:renovate
      - name: Validate native workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Check the strict compiler, semantic lint and format scope
        if: ${{ !cancelled() }}
        run: npm run check:quality

  fleet:
    needs: [scope, hosts]
    if: needs.scope.outputs.fleet-required == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/pi-compatibility.yml
    with:
      automation-ref: ${{ github.sha }}
      repository: ${{ needs.scope.outputs.fleet-repository }}
      official-version: ${{ needs.hosts.outputs.official-version }}
      fork-ref: ${{ needs.hosts.outputs.fork-ref }}
      # During the initial cross-repository PR rollout, this variable selects the candidate branches.
      # Clear it once those branches have merged; normal operation always qualifies main.
      source-ref: ${{ inputs.source-ref || vars.PI_COMPATIBILITY_SOURCE_REF || 'main' }}

  automation:
    if: always()
    needs: [scope, hosts, tests, configuration, fleet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - env:
          SCOPE: ${{ needs.scope.result }}
          HOSTS: ${{ needs.hosts.result }}
          TESTS: ${{ needs.tests.result }}
          CONFIGURATION: ${{ needs.configuration.result }}
          FLEET_REQUIRED: ${{ needs.scope.outputs.fleet-required }}
          FLEET_REPOSITORY: ${{ needs.scope.outputs.fleet-repository }}
          FLEET: ${{ needs.fleet.result }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci.mjs check
