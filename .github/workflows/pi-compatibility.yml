name: Pi compatibility

on:
  workflow_call:
    inputs:
      automation-ref:
        description: Exact revision of this reusable workflow and its scripts
        required: true
        type: string
      repository:
        description: Fleet repository, or all for a fleet run
        default: ''
        type: string
      source-ref:
        default: ''
        type: string
      host:
        description: 'Host selection: both for normal qualification, fork for fork reverse dependencies'
        default: both
        type: string
      waived-platforms:
        description: Include owner-waived diagnostic platforms (Windows) in the matrix
        default: true
        type: boolean
      official-version:
        description: Official version already resolved earlier in this run; empty resolves latest
        default: ''
        type: string
      fork-ref:
        description: Exact fork commit; defaults to maintained fitchmultz/pi main resolved once per run
        default: ''
        type: string
      fork-source-artifact:
        description: Optional native fork-source artifact from this same workflow run
        default: ''
        type: string
      check-published:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      fork-ref: ${{ steps.targets.outputs.forkRef }}
      needs-fork: ${{ steps.targets.outputs.needsFork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ inputs.automation-ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
          SOURCE_REF: ${{ inputs.source-ref || github.sha }}
          HOST: ${{ inputs.host }}
          WAIVED_PLATFORMS: ${{ inputs.waived-platforms }}
          OFFICIAL_VERSION: ${{ inputs.official-version }}
          FORK_REF: ${{ inputs.fork-ref }}
        run: node scripts/resolve-matrix.mjs

  fork-package:
    needs: resolve
    if: needs.resolve.outputs.needs-fork == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ inputs.automation-ref }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: fork/package-lock.json
      - name: Use the reviewed npm version
        run: |
          PM="$(node -p 'require("./automation/package.json").packageManager')"
          # Install with the target npm itself: an older npm cannot replace itself across majors in place.
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.fork-source-artifact != ''
        with:
          name: ${{ inputs.fork-source-artifact }}
          path: fork/.artifacts
      - name: Resolve the native model-data input before selecting a host cache
        working-directory: fork
        env:
          SOURCE_ARTIFACT: ${{ inputs.fork-source-artifact }}
        run: |
          npm ci --ignore-scripts
          if [[ -n "$SOURCE_ARTIFACT" ]]; then
            test "$(git rev-parse HEAD)" = "$(tr -d '\n' < .artifacts/source.commit)"
            tar -xzf .artifacts/source.tar.gz --strip-components=1
          else
            npm run hydrate:model-data
          fi
          git diff --exit-code
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: package-cache
        with:
          path: ${{ runner.temp }}/fork-package
          key: pi-fork-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ needs.resolve.outputs.fork-ref }}-${{ inputs.automation-ref }}-${{ hashFiles('fork/package-lock.json', 'fork/packages/ai/src/providers/data/*.json', 'fork/packages/ai/src/providers/data/.manifest.json') }}
      - name: Build the exact fork once for all compatibility lanes
        if: steps.package-cache.outputs.cache-hit != 'true'
        working-directory: fork
        env:
          FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
        run: |
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-host-${{ needs.resolve.outputs.fork-ref }}
          path: ${{ runner.temp }}/fork-package
          if-no-files-found: error
          retention-days: 7

  qualify:
    needs: [resolve, fork-package]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.fork-package.result == 'success' || needs.resolve.outputs.needs-fork == 'false')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    name: ${{ matrix.repo }} / ${{ matrix.label }} / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.repo == 'pi-subagents' && 120 || matrix.os == 'windows-latest' && (matrix.repo == 'pi-agent-browser-native' && 70 || matrix.repo == 'pi-cursor-sdk' && 35 || 25) || matrix.repo == 'pi-agent-browser-native' && 45 || matrix.repo == 'pi-apply-edits' && matrix.os == 'macos-latest' && 45 || 25 }}
    # The owner waived Windows qualification on 2026-09-21; retain actual diagnostic failures/artifacts.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ inputs.automation-ref }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: extension
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/package.json
      - name: Use the reviewed npm version on every Node baseline
        shell: bash
        run: |
          PM="$(node -p 'require("./automation/package.json").packageManager')"
          # Install with the target npm itself: an older npm cannot replace itself across majors in place.
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.host == 'fork'
        with:
          name: fork-host-${{ needs.resolve.outputs.fork-ref }}
          path: ${{ runner.temp }}/fork-package
      - name: Install native offline test prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep zstd attr acl libcap2-bin build-essential
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - name: Install native offline test prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          for tool in fd ripgrep zstd; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done
      - name: Initialize native Windows module discovery for bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.repo == 'pi-posthorse' || matrix.repo == 'pi-apply-edits' || matrix.repo == 'pi-subagents' || matrix.repo == 'pi-agent-browser-native'
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: matrix.repo == 'pi-posthorse' || matrix.repo == 'pi-apply-edits'
        with:
          toolchain: "1.99.0"
          components: llvm-tools
          cache: false
          override: true
          rustflags: ""
      - name: Keep native checker Rust available with isolated HOME
        if: matrix.repo == 'pi-posthorse' || matrix.repo == 'pi-apply-edits'
        shell: bash
        run: |
          sysroot="$(rustc --print sysroot)"
          printf '%s\n' "$sysroot/bin" >> "$GITHUB_PATH"
      - name: Install native skills test prerequisites
        if: matrix.repo == 'pi-agent-skills'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq librsvg2-bin default-jre-headless
      - name: Install D2 for real skills renderer checks
        if: matrix.repo == 'pi-agent-skills'
        run: |
          curl -fsSL https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/d2.tar.gz"
          printf '%s  %s\n' 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9 "$RUNNER_TEMP/d2.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/d2"
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP/d2"
          sudo install -m 755 "$(find "$RUNNER_TEMP/d2" -type f -name d2 -print -quit)" /usr/local/bin/d2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.repo == 'pi-agent-skills'
      - name: Install PMD for real code-smell helper checks
        if: matrix.repo == 'pi-agent-skills'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/code-smells-pmd"
          mkdir "$dir"
          gh api repos/pmd/pmd/releases/latest > "$dir/release.json"
          jq -e '[.assets[] | select(.name | startswith("pmd-dist-")) | select(.name | endswith("-bin.zip"))] |
            if length == 1 then .[0] else error("Expected one PMD binary distribution") end' \
            "$dir/release.json" > "$dir/asset.json"
          url="$(jq -r .browser_download_url "$dir/asset.json")"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$dir/asset.json")"
          curl -fL --retry 1 "$url" -o "$dir/pmd.zip"
          printf '%s  %s\n' "${digest#sha256:}" "$dir/pmd.zip" | sha256sum -c -
          unzip -q "$dir/pmd.zip" -d "$dir"
          bin="$(find "$dir" -type f -path '*/bin/pmd' -print -quit)"
          "$bin" --version
          dirname "$bin" >> "$GITHUB_PATH"
      - name: Verify native skills tools before qualification
        if: matrix.repo == 'pi-agent-skills'
        run: |
          for tool in uv pmd java d2 rsvg-convert jq; do
            command -v "$tool" || { echo "::error::Missing required pi-agent-skills test tool: $tool"; exit 1; }
          done
          uv --version
          pmd --version
          java -version
          d2 --version
          rsvg-convert --version
          jq --version
      - name: Qualify the selected host and consumer artifacts
        timeout-minutes: ${{ matrix.os == 'windows-latest' && (matrix.repo == 'pi-agent-browser-native' && 60 || matrix.repo == 'pi-cursor-sdk' && 25 || 15) || 360 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
          HOST: ${{ matrix.host }}
          VERSION: ${{ matrix.version }}
          PUBLISHED: ${{ inputs.check-published }}
          PI_COMPAT_LANE_LABEL: ${{ matrix.label }}
          PI_COMPAT_FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          set -o pipefail
          target="$VERSION"
          if [[ "$HOST" == fork ]]; then target="$RUNNER_TEMP/fork-package"; fi
          extra=()
          if [[ "$PUBLISHED" == true ]]; then extra+=(--published); fi
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          printf 'Qualification inputs only; not a completed qualification or provenance receipt.\nrepo=%s\nsource=%s\nhost=%s\ntarget=%s\nnode=%s\nautomation=%s\n' \
            "$REPO" "$(git -C "$GITHUB_WORKSPACE/extension" rev-parse HEAD)" "$HOST" "$target" \
            "$(node --version)" "$(git -C "$GITHUB_WORKSPACE/automation" rev-parse HEAD)" \
            > "$GITHUB_WORKSPACE/evidence/lane-inputs.txt"
          node automation/scripts/qualify.mjs --repo "$REPO" --source "$GITHUB_WORKSPACE/extension" \
            --host "$HOST" --target "$target" --output "$GITHUB_WORKSPACE/evidence" "${extra[@]}" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/qualification.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-${{ matrix.repo }}-${{ matrix.label }}-${{ matrix.os }}-${{ matrix.node }}
          path: evidence
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: compatibility
    if: always()
    needs: [resolve, fork-package, qualify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every intended compatibility lane
        env:
          RESOLVE: ${{ needs.resolve.result }}
          FORK: ${{ needs.fork-package.result }}
          NEEDS_FORK: ${{ needs.resolve.outputs.needs-fork }}
          QUALIFY: ${{ needs.qualify.result }}
        run: |
          test "$RESOLVE" = success
          test "$QUALIFY" = success
          if [[ "$NEEDS_FORK" == true ]]; then test "$FORK" = success; fi
