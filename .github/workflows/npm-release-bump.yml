name: npm version

on:
  workflow_call:
    inputs:
      automation-ref:
        description: Exact reviewed automation commit
        required: true
        type: string
      app-client-id:
        description: GitHub App client ID for version PRs
        required: true
        type: string
      package-qualified:
        description: Caller provides the package-specific release qualification
        required: false
        type: boolean
        default: false
      version-reviewed:
        description: Run the package's required exact-diff version reviews
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Private key stored in the main-only release environment
        required: false
      PI_DURABLE_ACCESS_TOKEN:
        description: Pi Durable owner token stored in the release environment
        required: true
      CURSOR_API_KEY:
        description: Cursor API key stored in the release environment
        required: true
      ZAI_API_KEY:
        description: Direct Z.ai credential for the package's version reviewer
        required: false
      CURSOR_CATALOG_API_KEY:
        description: Cursor catalog credential for the package's pre-merge review
        required: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ inputs.automation-ref }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: extension
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Use the reviewed automation npm
        run: |
          PM="$(node -p 'require("./automation/package.json").packageManager')"
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - if: inputs.version-reviewed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi-agent-skills
          ref: 0a1d941264a683c186adad7f18c78b9439e82028
          path: review-skills
          persist-credentials: false
      - if: inputs.version-reviewed
        name: Install the current official Pi reviewer
        run: |
          VERSION="$(npm view @earendil-works/pi-coding-agent@latest version)"
          npm install --prefix "$RUNNER_TEMP/npm-version-pi" --no-save --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$VERSION"
          echo "$RUNNER_TEMP/npm-version-pi/node_modules/.bin" >> "$GITHUB_PATH"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - id: reconcile
        name: Reconcile the next main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          ZAI_API_KEY: ${{ inputs.version-reviewed && secrets.ZAI_API_KEY || '' }}
          PI_RELEASE_REVIEW_SKILL: ${{ github.workspace }}/review-skills/skills/thermo-nuclear-code-quality-review/SKILL.md
        run: node automation/scripts/npm-version.mjs reconcile --source extension --app-slug "$APP_SLUG" ${{ inputs.package-qualified && '--package-qualified' || '' }} ${{ inputs.version-reviewed && '--version-reviewed' || '' }}
      - id: remediation
        if: steps.reconcile.outputs.pull != ''
        name: Address complete reviewer reports and failing checks
        env:
          GH_TOKEN: ${{ github.token }}
          PI_DURABLE_ORIGIN: ${{ vars.PI_DURABLE_ORIGIN }}
          PI_DURABLE_ACCESS_TOKEN: ${{ secrets.PI_DURABLE_ACCESS_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ZAI_API_KEY: ${{ inputs.version-reviewed && secrets.ZAI_API_KEY || '' }}
          PULL: ${{ steps.reconcile.outputs.pull }}
          HEAD: ${{ steps.reconcile.outputs.head }}
          RELEASE_SOURCE: ${{ steps.reconcile.outputs.source }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: node automation/scripts/npm-remediation.mjs --source extension --pull "$PULL" --head "$HEAD" --release-source "$RELEASE_SOURCE" --app-slug "$APP_SLUG" ${{ inputs.package-qualified && '--package-qualified' || '' }} ${{ inputs.version-reviewed && '--version-reviewed' || '' }}
      - if: steps.remediation.outputs.refresh == 'true'
        name: Reconcile the remediated version PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run npm-version.yml --repo "$GITHUB_REPOSITORY" --ref main
      - id: checks
        if: steps.remediation.outputs.ready == 'true'
        name: Wait for CI and current-head reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: ${{ steps.reconcile.outputs.pull }}
          HEAD: ${{ steps.reconcile.outputs.head }}
          CURSOR: ${{ steps.remediation.outputs.cursor }}
        run: node automation/scripts/npm-version.mjs wait --pull "$PULL" --head "$HEAD" --cursor "$CURSOR" ${{ inputs.package-qualified && '--package-qualified' || '' }} ${{ inputs.version-reviewed && '--version-reviewed' || '' }}
      - if: steps.checks.outputs.refresh == 'true'
        name: Reconcile resolved findings with a fresh App token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run npm-version.yml --repo "$GITHUB_REPOSITORY" --ref main
      - if: steps.checks.outputs.ready == 'true' && inputs.version-reviewed
        name: Qualify the prospective release before merging
        uses: ./automation/.github/actions/npm-version-candidate-review
        with:
          head: ${{ steps.reconcile.outputs.head }}
          release-source: ${{ steps.reconcile.outputs.source }}
          pull: ${{ steps.reconcile.outputs.pull }}
          review-skill: ${{ github.workspace }}/review-skills/skills/thermo-nuclear-code-quality-review/SKILL.md
          github-token: ${{ github.token }}
          catalog-key: ${{ secrets.CURSOR_CATALOG_API_KEY }}
          zai-key: ${{ secrets.ZAI_API_KEY }}
      - if: steps.checks.outputs.ready == 'true' && inputs.version-reviewed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-premerge-review
          path: |
            ${{ runner.temp }}/npm-premerge-candidate
            ${{ runner.temp }}/npm-premerge-review/catalog.json*
            ${{ runner.temp }}/npm-premerge-review/scope/scope.json
            ${{ runner.temp }}/npm-premerge-review/installers/
            ${{ runner.temp }}/npm-premerge-review/review.json*
          if-no-files-found: error
          retention-days: 7
      - id: merge-app
        if: steps.checks.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.checks.outputs.ready == 'true'
        name: Merge only the reviewed version PR head
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GH_TOKEN: ${{ steps.merge-app.outputs.token }}
          PULL: ${{ steps.reconcile.outputs.pull }}
          HEAD: ${{ steps.reconcile.outputs.head }}
          CURSOR: ${{ steps.remediation.outputs.cursor }}
        run: node automation/scripts/npm-version.mjs merge --source extension --pull "$PULL" --head "$HEAD" --cursor "$CURSOR" ${{ inputs.package-qualified && '--package-qualified' || '' }} ${{ inputs.version-reviewed && '--version-reviewed' || '' }}
      - if: always() && inputs.version-reviewed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-version-review
          path: ${{ runner.temp }}/npm-version-review
          if-no-files-found: ignore
          retention-days: 7
      - if: failure() && inputs.version-reviewed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-premerge-review-failed
          path: |
            ${{ runner.temp }}/npm-premerge-candidate
            ${{ runner.temp }}/npm-premerge-review/catalog.json*
            ${{ runner.temp }}/npm-premerge-review/scope/scope.json
            ${{ runner.temp }}/npm-premerge-review/installers/
            ${{ runner.temp }}/npm-premerge-review/review.json*
          if-no-files-found: ignore
          retention-days: 7
