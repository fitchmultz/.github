name: npm version

on:
  workflow_call:
    inputs:
      automation-ref:
        description: Exact reviewed automation commit
        required: true
        type: string
      app-client-id:
        description: GitHub App client ID for signed release commits
        required: true
        type: string
      package-qualified:
        description: Caller provides the package-specific release qualification
        required: false
        type: boolean
        default: false
      version-reviewed:
        description: Run the package's required exact-diff version reviews
        required: false
        type: boolean
        default: false
      supersede-version:
        description: Exact failed unpublished automatic version to replace on operator dispatch
        required: false
        type: string
        default: ''
      supersede-source:
        description: Exact failed automatic version commit SHA, paired with supersede-version
        required: false
        type: string
        default: ''
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Private key stored in the main-only release environment
        required: false
      PI_DURABLE_ACCESS_TOKEN:
        description: Accepted for legacy caller compatibility; unused by direct versioning
        required: false
      CURSOR_API_KEY:
        description: Accepted for legacy caller compatibility; unused by direct versioning
        required: false
      ZAI_API_KEY:
        description: Direct Z.ai credential for the package's version reviewer
        required: false
      CURSOR_CATALOG_API_KEY:
        description: Accepted for legacy caller compatibility; unused by direct versioning
        required: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ inputs.automation-ref }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: extension
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Use the reviewed automation npm
        run: |
          PM="$(node -p 'require("./automation/package.json").packageManager')"
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - if: inputs.version-reviewed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi-agent-skills
          ref: 0a1d941264a683c186adad7f18c78b9439e82028
          path: review-skills
          persist-credentials: false
      - if: inputs.version-reviewed
        name: Install the current official Pi reviewer
        run: |
          VERSION="$(npm view @earendil-works/pi-coding-agent@latest version)"
          npm install --prefix "$RUNNER_TEMP/npm-version-pi" --no-save --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$VERSION"
          echo "$RUNNER_TEMP/npm-version-pi/node_modules/.bin" >> "$GITHUB_PATH"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
      - id: reconcile
        name: Reconcile the next main release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SUPERSEDE_VERSION: ${{ inputs.supersede-version }}
          SUPERSEDE_SOURCE: ${{ inputs.supersede-source }}
          ZAI_API_KEY: ${{ inputs.version-reviewed && secrets.ZAI_API_KEY || '' }}
          PI_RELEASE_REVIEW_SKILL: ${{ github.workspace }}/review-skills/skills/thermo-nuclear-code-quality-review/SKILL.md
        run: |
          recovery=()
          if [[ -n "$SUPERSEDE_VERSION" || -n "$SUPERSEDE_SOURCE" ]]; then
            recovery=(--supersede-version "$SUPERSEDE_VERSION" --supersede-source "$SUPERSEDE_SOURCE")
          fi
          node automation/scripts/npm-version.mjs reconcile --source extension --app-slug "$APP_SLUG" "${recovery[@]}" ${{ inputs.package-qualified && '--package-qualified' || '' }} ${{ inputs.version-reviewed && '--version-reviewed' || '' }}
      - if: always() && inputs.version-reviewed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-version-review
          path: ${{ runner.temp }}/npm-version-review
          if-no-files-found: ignore
          retention-days: 7
