name: Publish an npm candidate
description: Verify and publish the caller's prepared candidate
inputs:
  source-ref:
    required: true
    description: Exact caller commit
  release-source:
    required: true
    description: Original main commit covered by this version
  official-version:
    required: true
    description: Frozen official host version
  fork-ref:
    required: true
    description: Frozen fork host commit
  qualified:
    required: true
    description: Whether the caller supplied a package qualification receipt
  bootstrap-token:
    required: false
    description: Environment-only token for a first scoped publication
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        check-latest: true
        registry-url: https://registry.npmjs.org/
        package-manager-cache: false
    - name: Use the reviewed publishing npm
      shell: bash
      run: |
        PM="$(node -p 'require("./automation/package.json").packageManager')"
        npm exec --yes --package="$PM" -- npm install --global "$PM"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: npm-candidate-${{ inputs.source-ref }}
        path: ${{ runner.temp }}/npm-candidate
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: npm-fork-host-${{ inputs.source-ref }}
        path: ${{ runner.temp }}/fork-package
    - if: inputs.qualified == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: npm-release-qualification
        path: ${{ runner.temp }}/npm-qualification
    - name: Publish the verified artifact without lifecycle scripts
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NPM_BOOTSTRAP_TOKEN: ${{ inputs.bootstrap-token }}
        SOURCE_REF: ${{ inputs.source-ref }}
        RELEASE_SOURCE: ${{ inputs.release-source }}
        OFFICIAL_VERSION: ${{ inputs.official-version }}
        FORK_REF: ${{ inputs.fork-ref }}
        QUALIFIED: ${{ inputs.qualified }}
      run: |
        args=()
        if [ "$QUALIFIED" = true ]; then
          args+=(--qualification "$RUNNER_TEMP/npm-qualification/qualification.json")
        fi
        node automation/scripts/npm-release.mjs publish \
          --artifact "$RUNNER_TEMP/npm-candidate" --fork "$RUNNER_TEMP/fork-package" \
          --source-ref "$SOURCE_REF" --release-source "$RELEASE_SOURCE" \
          --official-version "$OFFICIAL_VERSION" --fork-ref "$FORK_REF" "${args[@]}"
